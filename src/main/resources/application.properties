
spring.application.name=porelgusto-web
server.port=8080

# Perfil activo por defecto (dev = H2 en memoria). En producción: --spring.profiles.active=prod
spring.profiles.active=prod

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Vistas JSP: el nombre "index" se busca en src/main/webapp/WEB-INF/jsp/index.jsp
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Sesión solo por cookie (evita ";jsessionid=..." en las URLs)
server.servlet.session.tracking-modes=cookie

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Conexión MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/porElGusto
spring.datasource.username=root
spring.datasource.password=n0m3l0
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
