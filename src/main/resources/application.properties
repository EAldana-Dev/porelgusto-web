spring.application.name=porelgusto-web
server.port=8080

# El CMD activa prod; fuera de ese flujo se usa dev.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# Respeta los nombres explícitos camelCase de columnas y tablas definidos en las entidades y sql/db.sql.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Vistas JSP
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Sesión solo por cookie
server.servlet.session.tracking-modes=cookie

# Autenticación (valor base; sobreescribir con variable de entorno en prod)
app.auth.default-user-type-id=1
app.auth.token-expiration-seconds=3600

# Configuración común de MySQL; config-env.cmd proporciona DB_* y SPRING_DATASOURCE_*.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/porElGusto}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

app.auth.token-secret=${AUTH_TOKEN_SECRET:dev-only-change-this-token-secret-32-bytes-minimum}
