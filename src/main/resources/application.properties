spring.application.name=porelgusto-web
server.port=8080

# Perfil por defecto si no se especifica otro
spring.profiles.active=dev

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Vistas JSP
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Sesión solo por cookie
server.servlet.session.tracking-modes=cookie

# Autenticación (valor base; sobreescribir con variable de entorno en prod)
app.auth.default-user-type-id=1
app.auth.token-expiration-seconds=3600
