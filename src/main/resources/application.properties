spring.application.name=porelgusto-web
server.port=8080

# El CMD activa prod; fuera de ese flujo se usa dev (MySQL local). Sin MySQL: --spring.profiles.active=h2
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA / Hibernate
# Las vistas JSP leen relaciones (p. ej. pedido.items); se mantiene abierta la sesión de JPA durante la petición.
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true
# Respeta los nombres explícitos camelCase de columnas y tablas definidos en las entidades y sql/db.sql.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Vistas JSP
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Sesión solo por cookie
server.servlet.session.tracking-modes=cookie

# Subida de imágenes de productos (panel de administración)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Páginas de error: nunca mostrar detalles internos (stack trace) al usuario
server.error.include-stacktrace=never
server.error.include-message=always

# Autenticación de la API (valor base; sobreescribir con variable de entorno en prod)
app.auth.default-user-type-id=1
app.auth.token-expiration-seconds=3600

# ---------------- Por el Gusto ----------------
# Carpeta donde se guardan las imágenes que sube el administrador (se sirven en /uploads/**)
app.uploads.dir=uploads

# Datos de la tienda (pie de página, soporte y WhatsApp)
app.tienda.correo=contacto@porelgusto.mx
app.tienda.telefono=55 1050 1488
app.whatsapp.numero=525510501488
# Horario en que se atiende por WhatsApp (24 h). Fuera de horario se muestra el contacto.
app.whatsapp.hora-inicio=8
app.whatsapp.hora-fin=21

# Impuestos (los precios del catálogo ya incluyen IVA)
app.pedido.iva=0.16

# Envío por distancia en línea recta desde la florería (dentro de la CDMX).
# Hasta km1 cuesta tarifa10, hasta km2 tarifa15 y hasta km3 tarifa20. Gratis desde envio-gratis-desde.
# A más de km3 o fuera de la CDMX siempre se cobra tarifa20 (no aplica el envío gratis).
app.pedido.envio-gratis-desde=1500
app.envio.km1=10
app.envio.km2=15
app.envio.km3=20
app.envio.tarifa10=100
app.envio.tarifa15=150
app.envio.tarifa20=200
# Punto de partida inicial (se cambia desde el panel: Configuración de la tienda)
app.envio.origen.direccion=San Bernab\u00e9, Azcapotzalco, 02830 Ciudad de M\u00e9xico, CDMX
app.envio.origen.latitud=19.4688808
app.envio.origen.longitud=-99.1729382
# Ubicar direcciones en el mapa con OpenStreetMap (Nominatim, gratis y sin llave)
app.envio.geocodificador.activo=true

# Pagos. Las llaves se capturan en el panel (Configuración de la tienda); estas variables solo se usan
# si en el panel no hay llaves. Si no hay llaves en ningún lado, el pago funciona en MODO SIMULADO.
# Stripe (tarjetas): https://dashboard.stripe.com/test/apikeys  -> clave secreta "sk_test_..."
app.pagos.stripe.secret-key=${STRIPE_SECRET_KEY:}
# PayPal (sandbox): https://developer.paypal.com/dashboard/applications/sandbox
app.pagos.paypal.client-id=${PAYPAL_CLIENT_ID:}
app.pagos.paypal.client-secret=${PAYPAL_CLIENT_SECRET:}
app.pagos.moneda=mxn

# Estadísticas de visitas: base de ubicaciones por IP de DB-IP (gratis, sin llave; scripts/descargar-geoip.sh)
app.estadisticas.geoip=geoip/dbip-city-lite.mmdb

# Correos. Con MAIL_HOST definido se envían por SMTP; sin él solo se guardan (panel: Correos enviados).
# Ejemplo con Gmail: MAIL_HOST=smtp.gmail.com, MAIL_PORT=587, MAIL_USERNAME=cuenta@gmail.com, MAIL_PASSWORD=<contraseña de aplicación>
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
app.correo.remitente=${MAIL_FROM:${MAIL_USERNAME:contacto@porelgusto.mx}}

# Swagger (documentación de la API JSON). Solo lo ven los administradores con sesión iniciada.
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Pagos simulados (sin llaves): solo para desarrollo y pruebas (perfil h2). En el sitio real, apagado.
app.pagos.simulados=false
