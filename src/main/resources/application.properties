spring.application.name=porelgusto-web
server.port=8080

# Perfil activo por defecto (dev = H2 en memoria). En producción: --spring.profiles.active=prod
spring.profiles.active=dev

# JPA / Hibernate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Vistas JSP: el nombre "index" se busca en src/main/webapp/WEB-INF/jsp/index.jsp
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Sesión solo por cookie (evita ";jsessionid=..." en las URLs)
server.servlet.session.tracking-modes=cookie
