# MySQL local. Connector/J crea la base si aún no existe y el usuario tiene permiso.
spring.datasource.url=jdbc:mysql://localhost:3306/porElGusto?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=n0m3l0

# Hibernate crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JSP: revisar cambios en cada petición (los .jsp se ven al recargar el navegador)
server.servlet.jsp.init-parameters.development=true
server.servlet.jsp.init-parameters.modificationTestInterval=0
server.tomcat.resource.cache-ttl=0ms

# Autenticación: usa un secreto propio de al menos 32 bytes fuera de desarrollo.
app.auth.token-secret=dev-only-change-this-token-secret-32-bytes-minimum
app.auth.default-user-type-id=1
app.auth.token-expiration-seconds=3600
