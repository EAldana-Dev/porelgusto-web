# Base de datos H2 en memoria (se borra al reiniciar)
spring.datasource.url=jdbc:h2:mem:porelgustoweb
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea/actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:porelgustoweb)
spring.h2.console.enabled=true

# JSP: revisar cambios en cada petición (los .jsp se ven al recargar el navegador)
server.servlet.jsp.init-parameters.development=true
server.servlet.jsp.init-parameters.modificationTestInterval=0
server.tomcat.resource.cache-ttl=0ms
