spring.datasource.url=jdbc:h2:mem:porelgustoweb
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true

server.servlet.jsp.init-parameters.development=true
server.servlet.jsp.init-parameters.modificationTestInterval=0
server.tomcat.resource.cache-ttl=0ms

app.auth.token-secret=dev-only-change-this-token-secret-32-bytes-minimum

spring.sql.init.mode=always


spring.jpa.defer-datasource-initialization=true
