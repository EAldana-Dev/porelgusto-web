# MySQL local para desarrollo; config-env.cmd puede sobreescribir estas variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/porElGusto?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:n0m3l0}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JSP: revisar cambios en cada petición (los .jsp se ven al recargar el navegador)
server.servlet.jsp.init-parameters.development=true
server.servlet.jsp.init-parameters.modificationTestInterval=0
server.tomcat.resource.cache-ttl=0ms

app.auth.token-secret=dev-only-change-this-token-secret-32-bytes-minimum

spring.sql.init.mode=always


spring.jpa.defer-datasource-initialization=true
