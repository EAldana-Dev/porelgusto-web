# Perfil para probar sin MySQL: H2 en memoria en modo compatible con MySQL (se borra al reiniciar).
# Arrancar con: ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
spring.datasource.url=jdbc:h2:mem:porelgusto;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:data.sql,classpath:data-h2.sql

# JSP: revisar cambios en cada petición
server.servlet.jsp.init-parameters.development=true
server.servlet.jsp.init-parameters.modificationTestInterval=0
server.tomcat.resource.cache-ttl=0ms

app.auth.token-secret=dev-only-change-this-token-secret-32-bytes-minimum

# Desarrollo y pruebas: sin llaves, los pagos se simulan (tarjeta 4242 4242 4242 4242 aprobada)
app.pagos.simulados=true
